# Release config consumed by `byt release` (ADR-0021).
# The reusable workflow builds linux-gnu in the byt container (glibc floor) and
# *-apple-darwin natively on a macOS runner, then combines + publishes.
[release]
name = "agntz"
lang = "rust"
bins = ["agntz"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[release.homebrew]
formula = "agntz"

[release.aur]
pkgname = "agntz"
pkgdesc = "Agent utility toolkit for AI coding agents"
license = "MIT"
url = "https://github.com/byteowlz/agntz"
depends = ["gcc-libs"]
